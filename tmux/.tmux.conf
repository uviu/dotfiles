#bind reload conf
unbind r
bind r source-file ~/.tmux.conf

#rebind super to ctrl s
set -g prefix C-s

#enable mousesupport
set -g mouse on

#ergonomic split
unbind %
bind-key ! split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

#setup nvim style panel navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize panes with prefix + shift hjkl (repeatable)
unbind -T root H
unbind -T root J
unbind -T root K
unbind -T root L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# don't rename windows automatically
set-option -g allow-rename off

#list of plugins
set -g @plugin 'tmux-plugins/tpm'

# session persistence across restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# restore saved session automatically when tmux server starts
set -g @continuum-restore 'on'
# save every 15 minutes (default)
set -g @continuum-save-interval '15'
# capture pane contents so scrollback survives too
set -g @resurrect-capture-pane-contents 'on'
# restore running programs (nvim, etc.)
set -g @resurrect-strategy-nvim 'session'

# transparent pane borders
set -g pane-border-style fg=colour0
set -g pane-active-border-style fg=colour0

#disable tmux statusbar (redundant information)
set -g status off
#keymap to compensate for missing window bar
bind w choose-tree -w

run '~/.tmux/plugins/tpm/tpm'
